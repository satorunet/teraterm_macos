# Tera Term SP (iPhone / iPad の試作版) を組み立てて TestFlight に上げる。
# 手元の Mac は Xcode 13.1 (iOS 15 まで) なので、新しい Xcode のある GitHub の Mac で組み立てる。
# 署名は App Store Connect の API キーで Xcode にまかせる (証明書ファイルは置かない)。
# 要る Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (API キーの .p8 の中身そのまま)
name: Tera Term SP TestFlight

on:
  push:
    branches: [tera-term-sp]
    paths:
      - "ios/**"
      - "macos/Sources/TeraCore/**"
      - "macos/Sources/COniguruma/**"
      - "macos/Sources/CTeraFile/**"
      - ".github/workflows/terasp-testflight.yml"
  workflow_dispatch:

concurrency:
  group: terasp-testflight
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # -eo pipefail (xcodebuild | xcbeautify の失敗も止める)

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: SSH の部品 (キャッシュ)
        uses: actions/cache@v4
        with:
          path: |
            ios/Vendor/ssh-device
            ios/Sources/CSSH2/include/libssh2*.h
          key: ssh-device-${{ hashFiles('ios/scripts/build-ssh-libs.sh') }}

      - name: SSH の部品 (libssh2 + OpenSSL)
        run: |
          if [ ! -f ios/Vendor/ssh-device/lib/libssh2.a ]; then ./ios/scripts/build-ssh-libs.sh device; fi

      - name: API キー
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"

      - name: 組み立て (archive)
        env:
          TERASP_SSH_KIND: device
          TERASP_BUILD: ${{ github.run_number }}
        run: |
          python3 ios/scripts/gen-project.py
          xcodebuild -project ios/TeraSP.xcodeproj -scheme TeraSP -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/TeraSP.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            archive | xcbeautify --quiet

      - name: TestFlight に上げる
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>99NFJH4MCR</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TeraSP.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: 後片付け
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
