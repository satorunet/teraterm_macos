<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN"
  "http://www.w3.org/TR/html4/strict.dtd">
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS">
    <title>ホストリストの編集</title>
    <META http-equiv="Content-Style-Type" content="text/css">
    <link rel="stylesheet" href="../style.css" type="text/css">
  </head>

  <body>
    <h1>ホストリストの編集</h1>

    <p>
      一覧で行を選ぶと、その内容が編集欄に入ります。OK で保存し、キャンセルで変更を破棄します。
    </p>

    <dl>

      <dt>Add</dt>
      <dd>
        編集中の1行をヒストリに追加します。選択項目があるときはその位置に、ないときは先頭に追加します。
      </dd>

      <dt>Replace</dt>
      <dd>
        ヒストリの選択項目を編集中の1行で置き換えます。
      </dd>

      <dt>Remove</dt>
      <dd>
        ヒストリの選択項目を削除します。
      </dd>

      <dt>Up</dt>
      <dd>
        ヒストリの選択項目を1つ上に移動します。
      </dd>

      <dt>Down</dt>
      <dd>
        ヒストリの選択項目を1つ下に移動します。
      </dd>

    </dl>
  </body>
</html>
