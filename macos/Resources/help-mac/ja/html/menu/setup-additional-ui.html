    <meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS">
    <title>Additional settings / "UI" タブ ([Setup] メニュー)</title>
    <META http-equiv="Content-Style-Type" content="text/css">
    <link rel="stylesheet" href="../style.css" type="text/css">
  </head>

  <body>
    <h1><a href="setup-additional.html">Additional settings</a> / "UI" タブ ([Setup] メニュー)</h1>

    <dl>
      <dt id="UILanguageFile">UI Language</dt>
      <dd>
	メニューやメッセージの言語を選びます。一覧はアプリに同梱された言語ファイル (*.lng) から作られます。<br>
	先頭の「自動 (macOS の設定に従う)」を選ぶと、macOS の言語設定に合う言語を使います。<br>
	OK を押すと切り替わります。
	<A HREF="../setup/lng.html">言語ファイル</A>も参照してください。
      </dd>

      <dt id="ListHiddenFonts">フォント設定/フォントフォルダを開く</dt>
      <dd>
        リンクをクリックすると、Finder でユーザのフォントフォルダ (~/Library/Fonts) を開きます。
      </dd>
    </dl>

  </body>
</html>
