<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS">
    <title>Load key map ([Setup] メニュー)</title>
    <META http-equiv="Content-Style-Type" content="text/css">
    <link rel="stylesheet" href="../style.css" type="text/css">
  </head>

  <body>
    <h1>Load key map ([Setup] メニュー)</h1>
    <p>
      <A HREF="../setup/keyboard.html">キーボード設定ファイル</A>
      の内容にしたがってキーボードを設定しなおします。
    </p>

    <h2>"Load key map" ダイアログボックス</h2>
    <p>
      Mac の標準のファイル選択パネルが、端末ウィンドウのシートとして開きます。
      すでに存在するキーボード設定ファイル (.cnf) を選んでください。
      初期値は ~/Library/Application Support/Tera Term Mac/KEYBOARD.CNF です。<br>
      同じキーコードが 2 回以上割り当てられているときは、エラーの一覧が表示されます。
    </p>
  </body>
</html>
