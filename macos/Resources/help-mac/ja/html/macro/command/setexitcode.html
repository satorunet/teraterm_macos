<h1>setexitcode</h1>

<p>
終了コードを設定するコマンド。Tera Term Mac では何もしない。
</p>

<pre class="macro-syntax">
setexitcode &lt;exit code&gt;
</pre>

<h2>解説</h2>

<p>
Tera Term Mac では何もしません (Windows のマクロとの互換のために受け付けます)。<br>
マクロは Tera Term Mac の中で動くので、終了コードを受け取る方法はありません。エラーにはなりません。
</p>
