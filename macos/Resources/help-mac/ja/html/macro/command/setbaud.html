<h1>setbaud</h1>

<p>
シリアルポートのスピードを変更する。
</p>

<pre class="macro-syntax">
setbaud &lt;value&gt;
</pre>

<h2>パラメータ</h2>

<dl>
	<dt class="macro">整数 &lt;value&gt;</dt>
	<dd>スピードを指定する。</dd>
</dl>

<h2>例</h2>

<pre class="macro-example">
; change speed to 115200 bps
setbaud 115200
</pre>

<h2>参照</h2>

<ul>
  <li><a href="setspeed.html">setspeed</a></li>
</ul>

</body>
