<h1>setdebug</h1>

<p>
デバッグモードを設定するコマンド。Tera Term Mac では何もしない。
</p>

<pre class="macro-syntax">
setdebug &lt;flag&gt;
</pre>

<h2>解説</h2>

<p>
Tera Term Mac では何もしません (Windows のマクロとの互換のために受け付けます)。<br>
Tera Term Mac にはデバッグモードはありません。
</p>
