<h1>loadkeymap</h1>

<p>
キーボード設定ファイルを読み込むコマンド。Tera Term Mac では何もしない。
</p>

<pre class="macro-syntax">
loadkeymap &lt;filename&gt;
</pre>


<h2>解説</h2>

<p>
Tera Term Mac では何もしません (Windows のマクロとの互換のために受け付けます)。<br>
キーボード設定ファイルを読み込むときは、[設定] メニューの [キーマップ読み込み...] を使ってください。
</p>

</body>
