<h1>setdate</h1>

<p>
システムの日付を変更するコマンド。Tera Term Mac では何もしない。
</p>

<pre class="macro-syntax">
setdate &lt;date&gt;
</pre>

<h2>解説</h2>

<p>
Tera Term Mac では何もしません (Windows のマクロとの互換のために受け付けます)。<br>
&lt;date&gt; の形式は "YYYY-MM-DD"。Mac では、アプリからシステムの時計を変えられません。
</p>
