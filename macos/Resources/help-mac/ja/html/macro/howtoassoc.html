<h1>"TTL" ファイルを Tera Term Mac で開く方法</h1>

<p>
Tera Term Mac は、拡張子 ".ttl" のファイルを開くアプリとして登録されています。Finder で .ttl ファイルをダブルクリックすると、Tera Term Mac がマクロを実行します。
</p>

<p>
ほかのアプリで開くようになっているときは、次のようにしてください。
</p>

<ol>
  <li>Finder で .ttl ファイルを選び、[ファイル] メニューの [情報を見る] (&#x2318;I) を選ぶ。</li>
  <li>「このアプリケーションで開く」で Tera Term Mac を選ぶ。</li>
  <li>「すべてを変更...」ボタンを押す。</li>
</ol>
