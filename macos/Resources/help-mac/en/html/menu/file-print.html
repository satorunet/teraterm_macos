<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
    <title>Print ([File] menu)</title>
    <META http-equiv="Content-Style-Type" content="text/css">
    <link rel="stylesheet" href="../style.css" type="text/css">
  </head>

  <body>
    <h1>Print ([File] menu)</h1>

    <h2>"Print" dialog box</h2>
    <p>
      The standard macOS print dialog opens.
      Text is printed in the terminal font, black on white.
    </p>
    <dl>
      <dt>Print Range</dt>
      <dd>
	If no text is selected, the current screen is printed.<br>
	If text is selected, you can choose "Selection Only" to print just the selected text.
      </dd>
    </dl>
  </body>
</html>
