<h1>settime</h1>

<p>
Command to change the system time. Tera Term Mac does nothing.
</p>

<pre class="macro-syntax">
settime &lt;time&gt;
</pre>

<h2>Remarks</h2>

<p>
Tera Term Mac does nothing for this command (it is accepted for compatibility with Windows macros).<br>
The format of &lt;time&gt; is "HH:MM:SS". On a Mac, an application cannot change the system clock.
</p>
