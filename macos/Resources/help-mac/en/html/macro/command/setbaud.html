<h1>setbaud</h1>

<p>
Causes Tera Term to change speed of serial port.
</p>

<pre class="macro-syntax">
setbaud &lt;value&gt;
</pre>

<h2>Parameters</h2>

<dl>
	<dt class="macro">integer &lt;value&gt;</dt>
	<dd>The immediate speed.</dd>
</dl>

<h2>Example</h2>

<pre class="macro-example">
; change speed to 115200 bps
setbaud 115200
</pre>

<h2>See also</h2>

<ul>
  <li><a href="setspeed.html">setspeed</a></li>
</ul>
