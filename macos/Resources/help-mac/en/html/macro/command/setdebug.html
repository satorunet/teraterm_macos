<h1>setdebug</h1>

<p>
Command to configure the debug mode. Tera Term Mac does nothing.
</p>

<pre class="macro-syntax">
setdebug &lt;flag&gt;
</pre>

<h2>Remarks</h2>

<p>
Tera Term Mac does nothing for this command (it is accepted for compatibility with Windows macros).<br>
Tera Term Mac has no debug mode.
</p>
